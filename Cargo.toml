[package]
name = "hid-backlight-guard"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Alexander Drichel"]
description = "Lightweight cross-platform pure-Rust daemon that turns peripheral backlights off when the display turns off or the system suspends"
readme = "README.md"
homepage = "https://github.com/drlalx/hid-backlight-guard"
repository = "https://github.com/drlalx/hid-backlight-guard"
license = "GPL-2.0-or-later"
keywords = ["hid", "backlight", "razer", "logitech", "rgb"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev", "macos-shared-device"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", features = ["blocking-api"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
